schema_version: 1

context:
  version: "5.0.0"

package:
  name: splink
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splink/splink-${{ version }}.tar.gz
  sha256: 389dfc2669b08889324571d5ef19a068bc8901e3a6ea1cc5c23af95fbe021177

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - python-duckdb >=0.9.2
    - pyarrow >=18.0.0
    - sqlglot >=17.6.0
  run_constraints:
    # optional dependencies (extras) as of splink 5.0
    - altair >=5.0.1
    - numpy >=1.19.3
    - pandas >=1.3.5
    - python-igraph >=0.11.2
    - rapidfuzz >=3.10.0
    - pyspark >=3.5.0
    - sqlalchemy >=2.0.0

tests:
  - python:
      imports:
        - splink
      pip_check: true
      # Test on both the oldest supported and the newest available Python.
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/moj-analytical-services/splink
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast, accurate and scalable probabilistic data linkage using your choice of SQL backend.
  documentation: https://moj-analytical-services.github.io/splink/

extra:
  recipe-maintainers:
    - ThomasHepworth
    - ADBond
